name: Charybdis Mini Vial firmware

on:
  push:
    paths:
      - "charybdis-mini/vial/**"
      - ".github/workflows/charybdis-vial.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    strategy:
      matrix:
        # The Splinktegrated rev1 has the same pins as the Splinky v3.
        controller: [splinky_3]
    steps:
      - name: Checkout dotfiles
        uses: actions/checkout@v4
        with:
          path: dotfiles

      - name: Checkout vial-qmk
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: vial-qmk
          submodules: recursive

      - name: Build
        working-directory: vial-qmk
        run: |
          git config --global --add safe.directory '*'
          cp -r ../dotfiles/charybdis-mini/vial keyboards/bastardkb/charybdis/3x6/keymaps/alexandre
          make bastardkb/charybdis/3x6/v2/${{ matrix.controller }}:alexandre

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: charybdis-mini-vial-${{ matrix.controller }}
          path: vial-qmk/*.uf2
